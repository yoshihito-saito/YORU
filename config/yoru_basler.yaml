# YORU Real-time GUI Configuration with Basler Pypylon Camera
# This config enables pypylon as the camera backend

name: basler_pylon
root: './logs/'
export: 'camera_test/'
export_name: 'basler_test'

# ===== Model/YOLO Configuration =====
model:
  yolo_detection: True
  yolo_model_path: './yolov5s.pt'
  Trigger: False

# ===== Capture Style =====
capture_style:
  stream_MSS: False  # Use camera instead of screen capture

# ===== Trigger Configuration =====
trigger:
  trigger_threshold_configuration: 0.5
  trigger_class: 'running'
  Arduino_COM: 'COM3'
  trigger_style: 'standard_arduino'

# ===== Hardware Configuration =====
hardware:
  use_camera: True
  camera_backend: pypylon      # Use Basler pypylon camera
  camera_serial: ""           # Leave empty for auto-detect
  camera_pfs_path: "./test_camera/Camera_setting_40Hz.pfs"         # Optional .pfs file exported from pylon Viewer
  camera_id: 0                  # Camera index (0 = first camera)
  camera_scale: 1               # Downscale factor (1.0 = no scaling)
  camera_fps: 40                # Frames per second
  camera_imshow: True           # Show live camera feed in window

